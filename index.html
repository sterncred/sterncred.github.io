<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crédito Sterling</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #111111;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 480px; width: 100%; text-align: center; }
  h1 {
    font-family: "Century Schoolbook", Georgia, serif;
    font-style: italic;
    font-size: 34px;
    margin-bottom: 6px;
  }
  .sub {
    font-size: 11px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: #8A8A8A;
    margin-bottom: 40px;
  }
  a.tool {
    display: block;
    text-decoration: none;
    color: #111111;
    background: #F3F3F3;
    border: 1px solid #D8D8D8;
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 12px;
    font-size: 15px;
    text-align: left;
    transition: background .15s ease;
  }
  a.tool:hover { background: #ececec; }
  a.tool span.arrow { float: right; color: #8A8A8A; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Sterling</h1>
    <div class="sub">Crédito Sterling</div>

    <a class="tool" href="/solicitud/">Solicitud de Crédito <span class="arrow">→</span></a>
    <a class="tool" href="/actualizacion/">Actualización de Datos <span class="arrow">→</span></a>
    <a class="tool" href="/calculadora/">Calculadora de Financiación <span class="arrow">→</span></a>
    <a class="tool" href="/tiendas/">Directorio de Tiendas <span class="arrow">→</span></a>
  </div>
</body>
</html>
