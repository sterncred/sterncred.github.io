<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directorio de Tiendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0d0d;
    --panel: #1a1a1a;
    --panel-2: #202020;
    --line: #2e2e2e;
    --cream: #f5f2ec;
    --muted: #9a9a9a;
    --muted-2: #6f6f6f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    padding: 26px 16px 48px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{max-width: 760px; margin: 0 auto;}

  /* ---------- Franja de logos / filtro por marca ---------- */
  .brandbar{
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .brandbar button{
    background: #ffffff;
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 12px 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 60px;
    opacity: 0.42;
    transition: opacity .18s ease, border-color .18s ease, transform .12s ease;
  }
  .brandbar button.active{
    opacity: 1;
    border-color: var(--cream);
  }
  .brandbar button:active{ transform: scale(0.96); }
  .brandbar img{
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
  }

  .reset-row{
    display:flex;
    justify-content:center;
    margin-bottom: 24px;
  }
  .reset-btn{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 9px 22px;
    border-radius: 100px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .reset-btn.active{
    background: var(--cream);
    border-color: var(--cream);
    color: #0d0d0d;
  }

  /* ---------- Encabezado ---------- */
  header.hero{
    text-align: center;
    padding-bottom: 24px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow{
    text-transform: uppercase;
    letter-spacing: 0.22em;
    font-size: 10.5px;
    color: var(--muted-2);
    font-weight: 600;
    margin-bottom: 12px;
  }
  h1{
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: clamp(28px, 8vw, 40px);
    margin: 0;
    line-height: 1.1;
    color: var(--cream);
  }
  header.hero p{
    color: var(--muted);
    font-size: 13.5px;
    margin: 12px auto 0;
    line-height: 1.55;
    max-width: 420px;
  }

  /* ---------- Buscador y filtros ---------- */
  .search-row{
    display:flex;
    align-items:center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 18px;
    transition: border-color .15s ease;
  }
  .search-row:focus-within{ border-color: var(--cream); }
  .search-row svg{ margin-left: 15px; flex-shrink:0; }
  .search-row input{
    flex:1;
    background: transparent;
    border:none;
    outline:none;
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    padding: 15px 15px 15px 11px;
    width:100%;
  }
  .search-row input::placeholder{ color: var(--muted-2); }

  .filter-label{
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted-2);
    font-weight: 600;
    margin: 0 0 10px;
  }

  .chips{
    display:flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 20px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 100px;
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s ease;
  }
  .chip.active{
    background: var(--cream);
    border-color: var(--cream);
    color: #0d0d0d;
    font-weight: 600;
  }

  .count{
    font-size: 11.5px;
    letter-spacing: 0.05em;
    color: var(--muted-2);
    margin-bottom: 16px;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* ---------- Grupos por marca ---------- */
  .brand-group{ margin-bottom: 30px; }
  .brand-head{
    display:flex;
    align-items:center;
    gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .brand-head .logo-box{
    background: #ffffff;
    border-radius: 6px;
    padding: 7px 10px;
    height: 38px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink: 0;
  }
  .brand-head .logo-box img{
    max-height: 100%;
    max-width: 92px;
    width:auto;
    display:block;
  }
  .brand-head .cnt{
    font-size: 11px;
    color: var(--muted-2);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* ---------- Tarjetas de tienda ---------- */
  .store{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 17px 18px;
    margin-bottom: 10px;
  }
  .store .city{
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted-2);
    margin-bottom: 7px;
    font-weight: 600;
  }
  .store .name{
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--cream);
    margin-bottom: 7px;
    line-height: 1.3;
  }
  .store .addr{
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 14px;
  }
  .store a.map{
    display:inline-flex;
    align-items:center;
    gap: 7px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #0d0d0d;
    background: var(--cream);
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 100px;
  }
  .store a.map:active{ opacity: 0.75; }

  .empty{
    text-align:center;
    color: var(--muted);
    font-size: 13.5px;
    padding: 56px 20px;
    line-height: 1.6;
  }

  footer{
    text-align:center;
    color: var(--muted-2);
    font-size: 11px;
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    line-height: 1.6;
  }
  footer .tagline{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--cream);
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brandbar" id="brandbar"></div>
  <div class="reset-row">
    <button class="reset-btn active" id="resetBtn">Ver todas las marcas</button>
  </div>

  <header class="hero">
    <div class="eyebrow">Directorio</div>
    <h1>Nuestras tiendas</h1>
    <p>Consulta las direcciones de todos nuestros puntos de venta en Colombia.</p>
  </header>

  <div class="search-row">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6f6f6f" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.5" y2="16.5"></line>
    </svg>
    <input type="text" id="search" placeholder="Buscar tienda, centro comercial o dirección…" autocomplete="off">
  </div>

  <p class="filter-label">Ciudad</p>
  <div class="chips" id="cityChips"></div>

  <div class="count" id="count"></div>
  <div id="list"></div>

  <footer>
    <div class="tagline">Lujo y exclusividad en toda Colombia.</div>
    Directorio de puntos de venta
  </footer>
</div>

  {"marca":"PURIFICACION GARCIA","ciudad":"Cartagena","nombre":"PG C.C. La Serrezuela","direccion":"C.C. La Serrezuela, Cra. 11 #39-21, Local 102"},
  {"marca":"PURIFICACION GARCIA","ciudad":"Sopó","nombre":"PG Outlet C.C. Arauco Sopó","direccion":"C.C. Premium Outlet Arauco, Carretera Nacional 50C Km 0.7, Vía Briceño, Vereda La Diana, Costado Norte, Local 34"},
  {"marca":"STERLING JOYEROS","ciudad":"Barranquilla","nombre":"Luxury Gardens","direccion":"Calle 79 No. 50-60"},
  {"marca":"STERLING JOYEROS","ciudad":"Bogotá","nombre":"Centro Comercial Unicentro","direccion":"Cra 15 No. 124-30"},
  {"marca":"STERLING JOYEROS","ciudad":"Bogotá","nombre":"Centro Comercial Andino","direccion":"Cra 11 No. 82-01"},
  {"marca":"STERLING JOYEROS","ciudad":"Cali","nombre":"Centro Comercial Unicentro","direccion":"Cra 100 #5 - 169"},
  {"marca":"STERLING JOYEROS","ciudad":"Cartagena","nombre":"La Serrezuela","direccion":"Carrera 11 No. 39-21"},
  {"marca":"STERLING JOYEROS","ciudad":"Medellín","nombre":"Centro Comercial El Tesoro","direccion":"Cra 25A #1A Sur - 45"},
  {"marca":"TIFFANY","ciudad":"Bogotá","nombre":"Bogotá - Andino Mall","direccion":"Andino Mall, Carrera 11 No. 82-71, Local 177"}
];

let filtroMarca = 'Todas';
let filtroCiudad = 'Todas';
let busqueda = '';

const marcas = Array.from(new Set(TIENDAS.map(t => t.marca)));
const ciudades = ['Todas', ...Array.from(new Set(TIENDAS.map(t => t.ciudad))).sort((a,b)=>a.localeCompare(b,'es'))];

function normalizar(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function logoDe(marca){
  return LOGOS[LOGO_KEY[marca]] || '';
}

function renderBrandBar(){
  const bb = document.getElementById('brandbar');
  bb.innerHTML = marcas.map(m =>
    '<button data-marca="'+escapeHtml(m)+'" class="'+(m===filtroMarca?'active':'')+'" aria-label="'+escapeHtml(m)+'">'
    + '<img src="'+logoDe(m)+'" alt="'+escapeHtml(m)+'">'
    + '</button>'
  ).join('');
  bb.querySelectorAll('button').forEach(el=>{
    el.addEventListener('click', ()=>{
      filtroMarca = (filtroMarca === el.dataset.marca) ? 'Todas' : el.dataset.marca;
      renderBrandBar(); renderReset(); render();
    });
  });
}

function renderReset(){
  const rb = document.getElementById('resetBtn');
  rb.className = 'reset-btn' + (filtroMarca === 'Todas' ? ' active' : '');
}

function renderCityChips(){
  const cc = document.getElementById('cityChips');
  cc.innerHTML = ciudades.map(c =>
    '<button class="chip'+(c===filtroCiudad?' active':'')+'" data-ciudad="'+escapeHtml(c)+'">'+escapeHtml(c)+'</button>'
  ).join('');
  cc.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{ filtroCiudad = el.dataset.ciudad; renderCityChips(); render(); });
  });
}

function render(){
  const q = normalizar(busqueda.trim());

  const filtradas = TIENDAS.filter(t => {
    if(filtroMarca !== 'Todas' && t.marca !== filtroMarca) return false;
    if(filtroCiudad !== 'Todas' && t.ciudad !== filtroCiudad) return false;
    if(q){
      const blob = normalizar(t.nombre + ' ' + t.direccion + ' ' + t.ciudad + ' ' + t.marca);
      if(blob.indexOf(q) === -1) return false;
    }
    return true;
  });

  document.getElementById('count').textContent =
    filtradas.length === 1 ? '1 tienda encontrada' : filtradas.length + ' tiendas encontradas';

  const list = document.getElementById('list');

  if(filtradas.length === 0){
    list.innerHTML = '<div class="empty">No se encontraron tiendas con estos filtros.<br>Intenta con otra búsqueda.</div>';
    return;
  }

  const grupos = [];
  filtradas.forEach(t => {
    let g = grupos.find(x => x.marca === t.marca);
    if(!g){ g = { marca: t.marca, items: [] }; grupos.push(g); }
    g.items.push(t);
  });

  let html = '';
  grupos.forEach(g => {
    html += '<div class="brand-group">';
    html += '<div class="brand-head">';
    html += '<div class="logo-box"><img src="'+logoDe(g.marca)+'" alt="'+escapeHtml(g.marca)+'"></div>';
    html += '<div class="cnt">'+g.items.length+(g.items.length===1?' tienda':' tiendas')+'</div>';
    html += '</div>';
    g.items.forEach(t => {
      const mapQuery = encodeURIComponent(t.nombre + ', ' + t.direccion + ', ' + t.ciudad + ', Colombia');
      html += '<div class="store">';
      html += '<div class="city">'+escapeHtml(t.ciudad)+'</div>';
      html += '<div class="name">'+escapeHtml(t.nombre)+'</div>';
      html += '<div class="addr">'+escapeHtml(t.direccion)+'</div>';
      html += '<a class="map" href="https://www.google.com/maps/search/?api=1&query='+mapQuery+'" target="_blank" rel="noopener">Ver en el mapa</a>';
      html += '</div>';
    });
    html += '</div>';
  });

  list.innerHTML = html;
}

document.getElementById('search').addEventListener('input', (e)=>{
  busqueda = e.target.value;
  render();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  filtroMarca = 'Todas';
  renderBrandBar(); renderReset(); render();
});

renderBrandBar();
renderReset();
renderCityChips();
render();

if('scrollRestoration' in history){ history.scrollRestoration = 'manual'; }
window.addEventListener('load', function(){ window.scrollTo(0, 0); });
</script>
